{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm mt-4">
            <div class="card-header bg-success text-white">
                <h4 class="mb-0">Raise a New IT Ticket</h4>
            </div>
            <div class="card-body p-4">
                <form action="{{ url_for('ticket_bp.create_ticket') }}" method="POST" enctype="multipart/form-data">
                    
                    <div class="mb-3">
                        <label for="title" class="form-label fw-bold">Issue Title</label>
                        <input type="text" class="form-control" id="title" name="title" placeholder="Brief summary of the issue" required>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="category_id" class="form-label fw-bold">Category</label>
                            <select class="form-select" id="category_id" name="category_id" required>
                                <option value="" selected disabled>Select a category...</option>
                                {% for cat in categories %}
                                    <option value="{{ cat.id }}">{{ cat.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="sla_id" class="form-label fw-bold">Priority Level</label>
                            <select class="form-select" id="sla_id" name="sla_id" required>
                                <option value="" selected disabled>Select priority...</option>
                                {% for sla in slas %}
                                    <option value="{{ sla.id }}">{{ sla.priority_level }} (Resolve within {{ sla.resolve_within_hours }}h)</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="description" class="form-label fw-bold">Detailed Description</label>
                        <textarea class="form-control" id="description" name="description" rows="5" placeholder="Please provide as much detail as possible, including any error codes..." required></textarea>
                    </div>

                    <div class="mb-4">
                        <label for="attachment" class="form-label fw-bold">Attach Screenshot (Optional)</label>
                        <input class="form-control" type="file" id="attachment" name="attachment" accept=".png,.jpg,.jpeg,.pdf,.txt,.log">
                        <div class="form-text">Max size 5MB.</div>
                    </div>

                    <div class="d-flex justify-content-between">
                        <a href="{{ url_for('user_bp.dashboard_redirect') }}" class="btn btn-outline-secondary">Cancel</a>
                        <button type="submit" class="btn btn-success">Submit Ticket</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
